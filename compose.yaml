services:
  rabbitmq:
    image: rabbitmq:4.3.7-management # pinned, no latest
    container_name: energysim-rabbitmq
    ports:
      - "127.0.0.1:5672:5672" # AMQP, this machine only
      - "127.0.0.1:15672:15672" # management UI, this machine only
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  rabbitmq-data:
